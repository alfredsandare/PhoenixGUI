[build-system]
requires = ["hatchling >= 1.26", "pygame >= 2.6.1"]
build-backend = "hatchling.build"

[project]
name = "PhoenixGUI"
version = "0.0.1"
authors = [
  { name="alfredsandare", email="alfred.s.sandare04@gmail.com" },
]
description = "A small example package"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/alfredsandare/PhoenixGUI"